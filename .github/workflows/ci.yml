name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-quality:
    name: API · migrations, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fitplan
          POSTGRES_USER: fitplan
          POSTGRES_PASSWORD: fitplan_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitplan -d fitplan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://fitplan:fitplan_ci_password@localhost:5432/fitplan
      SECRET_KEY: fitplan-ci-secret-key
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: http://localhost:5173

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Check migration drift
        run: alembic check

      - name: Lint
        run: ruff check app tests alembic

      - name: Test with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90

  web-quality:
    name: Web · lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    name: Docker · validate and build images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - api-quality
      - web-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API production image
        run: docker build --target production -t fitplan-api:ci apps/api

      - name: Build web production image
        run: docker build --target production -t fitplan-web:ci apps/web
