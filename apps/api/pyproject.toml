[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fitplan-api"
version = "0.1.0"
description = "API de FitPlan para planes de entrenamiento adaptativos"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.18.4",
  "fastapi[standard]==0.138.0",
  "email-validator==2.3.0",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.14.2",
  "PyJWT==2.13.0",
  "pwdlib[argon2]==0.3.0",
  "sqlalchemy==2.0.51",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.18",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
